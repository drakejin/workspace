# make bench 질문 (examples/sample-workspace 용) — 같은 질문을 memory-mcp 가 있을 때(with)와 없을 때(without) claude 에 시켜 비교한다.
# expect 의 문자열이 답에 모두 들어 있으면 정답으로 센다.
# 질문 파일은 meta-repo 밖에 둔다 — 안에 있으면 에이전트가 Grep 으로 정답을 읽는다 (bench 가 거부한다).
questions:
  - id: retry-count
    prompt: 결제 재시도는 지금 몇 회 하나? 숫자와 근거 문서 경로(source_path)를 한 줄로 답해.
    expect: ["5", "2026-10-06-retry-policy.md"]
  - id: idempotency-header
    prompt: order-api 가 이중 결제를 막으려고 결제 요청에 붙이는 HTTP 헤더 이름은? 헤더 이름과 근거 문서 경로를 한 줄로 답해.
    expect: ["Idempotency-Key", "0001-idempotency-key.md"]
  - id: order-status
    prompt: 현재 주문 상태(OrderStatus) 값을 모두 나열해.
    expect: ["CREATED", "PAID", "SHIPPED", "REFUNDED"]
  - id: catalog-price
    prompt: order-api 는 주문 금액을 어디에서 읽어 오나? 필드 이름으로 답해.
    expect: ["CatalogItem.price"]
